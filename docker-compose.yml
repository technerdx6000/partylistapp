version: '3.8'

services:
  # Database service
  db:
    image: mariadb:11
    container_name: partylist-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-partylistdb}
      MYSQL_USER: ${DB_USER:-partyuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-partypass}
    volumes:
      - db_data:/var/lib/mysql
      - ./api/setup-atlasdb.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./api/add-required-items.sql:/docker-entrypoint-initdb.d/02-required-items.sql
    ports:
      - "3306:3306"
    networks:
      - partylist-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      timeout: 20s
      retries: 10

  # API service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: partylist-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-partylistdb}
      DB_USER: ${DB_USER:-partyuser}
      DB_PASSWORD: ${DB_PASSWORD:-partypass}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - partylist-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: partylist-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - partylist-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
    driver: local

networks:
  partylist-network:
    driver: bridge
