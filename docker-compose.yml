services:
  # Database service
  db:
    image: mariadb:11
    container_name: partylist-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_password}
      MYSQL_DATABASE: ${DB_NAME:-listcollab}
      MYSQL_USER: ${DB_USER:-listcollab_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_app_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - partylist-network
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-change_me_root_password}" ]
      timeout: 20s
      retries: 10

  # API service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: partylist-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-listcollab}
      DB_USER: ${DB_USER:-listcollab_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_app_password}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && node dist/server.js"
    networks:
      - partylist-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3002/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: partylist-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - partylist-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db_data:
    driver: local

networks:
  partylist-network:
    driver: bridge
