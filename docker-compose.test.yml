services:
  test-db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password_only
      MYSQL_DATABASE: listcollab_test
      MYSQL_USER: listcollab_test_user
      MYSQL_PASSWORD: listcollab_test_password_only
    ports:
      - '3307:3306'
    volumes:
      - test_db_data:/var/lib/mysql
    healthcheck:
      test: [ 'CMD', 'mariadb-admin', 'ping', '-h', 'localhost', '-u', 'root', '-ptest_root_password_only' ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  test_db_data:
